<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mambrú</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/logoicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Barra de navegación flotante -->
    <header class="navbar">
        <div class="logo">
            <img src="img/logo.jpeg" alt="Mambrú Logo">
            <span class="logo-text">Mambrú</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="experiencias.html">experiencias</a>
            <a href="tecnicas.html">Técnicas</a>
            <a href="conocenos.html">Conócenos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <div class="cart">
            <button class="btn-cart">Carrito (0)</button>
        </div>
    </header>

    <!-- Sección de Contacto con fondo verde institucional -->
    <section class="shop" style="background-color: #1b3022; padding: 140px 20px 80px 20px; min-height: 80vh;">
        <div class="section-header">
            <h2 class="section-title" style="color: #ffffff;">Hablemos de Café</h2>
            <p class="section-subtitle" style="color: #d1d1d1;">¿Tienes dudas, pedidos al por mayor o quieres parchar con nosotros? Escríbenos.</p>
        </div>

        <!-- Tarjeta contenedora con contraste para el formulario -->
        <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
            <form style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label style="display: block; font-family: 'Space Grotesk', sans-serif; margin-bottom: 8px; font-weight: 600; color: #222;">Tu Nombre</label>
                    <input type="text" placeholder="Ej. Camila Andrés" style="width: 100%; padding: 12px; border: 2px solid #222; border-radius: 8px; font-family: inherit; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display: block; font-family: 'Space Grotesk', sans-serif; margin-bottom: 8px; font-weight: 600; color: #222;">Correo Electrónico</label>
                    <input type="email" placeholder="tu@correo.com" style="width: 100%; padding: 12px; border: 2px solid #222; border-radius: 8px; font-family: inherit; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display: block; font-family: 'Space Grotesk', sans-serif; margin-bottom: 8px; font-weight: 600; color: #222;">Mensaje</label>
                    <textarea rows="5" placeholder="Cuéntanos lo que necesites..." style="width: 100%; padding: 12px; border: 2px solid #222; border-radius: 8px; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="border: none; cursor: pointer; width: 100%; text-align: center; padding: 14px; font-weight: 700;">Enviar Mensaje</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <img src="img/logo.jpeg" alt="Mambrú" class="footer-logo">
                <h3>Mambrú</h3>
            </div>
            <p class="slogan">Café, Memoria, Territorio, Alma.</p>
            <p class="copyright">&copy; 2026 Mambrú. Creado con pasión.</p>
        </div>
    </footer>
</body>
</html>
